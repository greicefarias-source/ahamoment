<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aha Moment Tracker - Criativivo</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            color: #000;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 40px;
            gap: 20px;
        }

        .header-content h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #000;
        }

        .header-content p {
            font-size: 14px;
            color: #666;
        }

        .export-btn {
            padding: 10px 20px;
            background: #0F4C8C;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .export-btn:hover {
            background: #0a2f52;
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 16px;
            margin-bottom: 40px;
        }

        .metric-card {
            background: #f8f8f8;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }

        .metric-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 8px;
        }

        .metric-value {
            font-size: 28px;
            font-weight: 600;
            color: #000;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 40px;
        }

        .card {
            background: #fff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 24px;
        }

        .card h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #000;
        }

        .voting-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 600px;
            overflow-y: auto;
        }

        .voting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f8f8f8;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            transition: background 0.2s;
        }

        .voting-item:hover {
            background: #f0f0f0;
        }

        .voting-item-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .color-dot {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .feature-name {
            font-size: 13px;
            color: #000;
            font-weight: 500;
        }

        .voting-item-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .vote-count {
            font-size: 14px;
            font-weight: 600;
            color: #000;
            min-width: 30px;
            text-align: right;
        }

        .vote-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        .vote-btn:hover {
            opacity: 0.8;
        }

        .chart-container {
            position: relative;
            height: 350px;
            margin-bottom: 20px;
        }

        .distribution {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
        }

        .distribution-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .distribution-dot {
            width: 10px;
            height: 10px;
            border-radius: 2px;
            flex-shrink: 0;
        }

        .distribution-content {
            flex: 1;
        }

        .distribution-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }

        .distribution-bar {
            background: #f0f0f0;
            height: 6px;
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 4px;
        }

        .distribution-fill {
            height: 100%;
            transition: width 0.3s;
        }

        .distribution-percent {
            font-size: 13px;
            font-weight: 600;
            color: #000;
            min-width: 40px;
            text-align: right;
        }

        .footer-info {
            margin-top: 40px;
            padding: 16px;
            background: #f8f8f8;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            font-size: 12px;
            color: #666;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
            }

            .metrics {
                grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            }

            .distribution {
                grid-template-columns: 1fr;
            }
        }

        .scrollbar-styled::-webkit-scrollbar {
            width: 6px;
        }

        .scrollbar-styled::-webkit-scrollbar-track {
            background: #f0f0f0;
            border-radius: 3px;
        }

        .scrollbar-styled::-webkit-scrollbar-thumb {
            background: #0F4C8C;
            border-radius: 3px;
        }

        .voting-list {
            scrollbar-color: #0F4C8C #f0f0f0;
            scrollbar-width: thin;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <h1>Aha Moment Tracker</h1>
                <p>Monitorando qual funcionalidade gera mais impacto para os clientes</p>
            </div>
            <button class="export-btn" onclick="exportCSV()">
                ⬇️ Exportar CSV
            </button>
        </div>

        <div class="metrics" id="metrics"></div>

        <div class="main-grid">
            <div class="card">
                <h2>Vote nas funcionalidades</h2>
                <div class="voting-list scrollbar-styled" id="votingList"></div>
            </div>

            <div class="card">
                <h2>Top 5 Aha Moments</h2>
                <div class="chart-container">
                    <canvas id="topChart" role="img" aria-label="Gráfico de barras com top 5 funcionalidades mais votadas"></canvas>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>Distribuição de votos (%)</h2>
            <div class="distribution" id="distribution"></div>
        </div>

        <div class="footer-info">
            ℹ️ Os dados são salvos automaticamente. Compartilhe esta página com seu time para acompanharem em tempo real.
        </div>
    </div>

    <script>
        const features = [
            'Relatório Whatsapp',
            'Alerta de Saldo',
            'Financeiro',
            'Dashboard compartilhado',
            'Canais de Atendimento',
            'Rastreamento de Leads',
            'Estúdio Criativo',
            'Visão Geral Meta Ads',
            'Visão Geral Google Ads',
            'Segundo Cérebro',
            'Central de tarefas',
            'Formulários'
        ];

        const azulGradient = ['#0F4C8C', '#1B63B8', '#2D7FD8', '#3B8FEF', '#4A9FFF'];

        let votes = {};
        let chart = null;

        function initVotes() {
            const saved = localStorage.getItem('ahaMomentVotes');
            if (saved) {
                try {
                    votes = JSON.parse(saved);
                } catch {
                    votes = features.reduce((acc, f) => ({ ...acc, [f]: 0 }), {});
                }
            } else {
                votes = features.reduce((acc, f) => ({ ...acc, [f]: 0 }), {});
            }
        }

        function saveVotes() {
            localStorage.setItem('ahaMomentVotes', JSON.stringify(votes));
        }

        function addVote(feature) {
            votes[feature]++;
            saveVotes();
            render();
        }

        function getTotal() {
            return Object.values(votes).reduce((a, b) => a + b, 0);
        }

        function getSortedData() {
            return Object.entries(votes)
                .map(([feature, voto]) => ({
                    feature,
                    votes: voto,
                    percent: getTotal() > 0 ? Math.round((voto / getTotal()) * 100) : 0
                }))
                .sort((a, b) => b.votes - a.votes);
        }

        function renderMetrics() {
            const total = getTotal();
            const topFeature = getSortedData()[0];

            const html = `
                <div class="metric-card">
                    <div class="metric-label">Total de votos</div>
                    <div class="metric-value">${total}</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Funcionalidades</div>
                    <div class="metric-value">${features.length}</div>
                </div>
                <div class="metric-card">
                    <div class="metric-label">Mais votada</div>
                    <div class="metric-value" style="font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${topFeature ? topFeature.feature : '—'}</div>
                </div>
            `;

            document.getElementById('metrics').innerHTML = html;
        }

        function renderVotingList() {
            const html = features.map((feature, idx) => `
                <div class="voting-item">
                    <div class="voting-item-left">
                        <div class="color-dot" style="background: ${azulGradient[idx % azulGradient.length]}"></div>
                        <span class="feature-name">${feature}</span>
                    </div>
                    <div class="voting-item-right">
                        <span class="vote-count">${votes[feature]}</span>
                        <button class="vote-btn" style="background: ${azulGradient[idx % azulGradient.length]}" onclick="addVote('${feature}')">+1</button>
                    </div>
                </div>
            `).join('');

            document.getElementById('votingList').innerHTML = html;
        }

        function renderChart() {
            const sorted = getSortedData().slice(0, 5);
            const ctx = document.getElementById('topChart').getContext('2d');

            if (chart) {
                chart.destroy();
            }

            chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: sorted.map(d => d.feature.length > 15 ? d.feature.substring(0, 12) + '...' : d.feature),
                    datasets: [{
                        label: 'Votos',
                        data: sorted.map(d => d.votes),
                        backgroundColor: '#2D7FD8',
                        borderRadius: 8,
                        borderSkipped: false
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            labels: {
                                color: '#666',
                                font: { size: 12 }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { color: '#666', font: { size: 12 } },
                            grid: { color: '#e0e0e0' }
                        },
                        x: {
                            ticks: { color: '#666', font: { size: 11 } },
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        function renderDistribution() {
            const sorted = getSortedData();
            const html = sorted.map((item, idx) => {
                const colorIndex = features.indexOf(item.feature) % azulGradient.length;
                return `
                    <div class="distribution-item">
                        <div class="distribution-dot" style="background: ${azulGradient[colorIndex]}"></div>
                        <div class="distribution-content">
                            <div class="distribution-label">${item.feature}</div>
                            <div style="display: flex; gap: 10px;">
                                <div class="distribution-bar" style="flex: 1;">
                                    <div class="distribution-fill" style="width: ${item.percent}%; background: ${azulGradient[colorIndex]}"></div>
                                </div>
                                <span class="distribution-percent">${item.percent}%</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('distribution').innerHTML = html;
        }

        function render() {
            renderMetrics();
            renderVotingList();
            renderChart();
            renderDistribution();
        }

        function exportCSV() {
            const sorted = getSortedData();
            const csvHeader = ['Funcionalidade', 'Votos', 'Percentual (%)'];
            const csvRows = sorted.map(item => [
                item.feature,
                item.votes,
                item.percent
            ]);

            const csvContent = [
                csvHeader,
                ...csvRows
            ].map(row => row.map(cell => `"${cell}"`).join(',')).join('\n');

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', `aha-moments-${new Date().toISOString().split('T')[0]}.csv`);
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        initVotes();
        render();
    </script>
</body>
</html>
